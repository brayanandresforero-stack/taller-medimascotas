<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediMascotas - Panel Veterinario</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 20px; background-color: #f4f6f9; color: #333; }
        header { background: #2c3e50; color: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; }
        header h1 { margin: 0; font-size: 22px; }
        .nav-buttons { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn { padding: 10px 18px; border: none; background-color: #3498db; color: white; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn:hover { background-color: #2980b9; }
        .panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .table-container { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #e0e0e0; }
        th { background-color: #34495e; color: white; }
        tr:hover { background-color: #f8f9fa; }
    </style>
</head>
<body>

    <header>
        <h1>MediMascotas — Vista de Consulta Médica</h1>
    </header>

    <div class="nav-buttons">
        <button class="btn" onclick="cargarSeccion('/api/duenomascota', 'Dueños de Mascotas')">Dueños</button>
        <button class="btn" onclick="cargarSeccion('/api/mascota', 'Mascotas')">Mascotas</button>
        <button class="btn" onclick="cargarSeccion('/api/medicamentos', 'Medicamentos')">Medicamentos</button>
        <button class="btn" onclick="cargarSeccion('/api/veterinaria', 'Veterinarias')">Veterinarias</button>
        <button class="btn" onclick="cargarSeccion('/api/inventario', 'Inventario')">Inventario</button>
    </div>

    <div class="panel">
        <h2 id="titulo-seccion">Selecciona un módulo</h2>
        <div id="contenedor-tabla" class="table-container">
            <p>Haz clic en cualquier botón de arriba para consultar los datos.</p>
        </div>
    </div>

    <script>
        async function cargarSeccion(endpoint, titulo) {
            document.getElementById('titulo-seccion').innerText = titulo;
            const contenedor = document.getElementById('contenedor-tabla');
            contenedor.innerHTML = '<p>Cargando información desde la API...</p>';

            try {
                const response = await fetch(endpoint);

                if (!response.ok) {
                    throw new Error("Respuesta HTTP " + response.status + ": " + response.statusText);
                }

                const result = await response.json();
                const data = result.data || result;

                if (!Array.isArray(data) || data.length === 0) {
                    contenedor.innerHTML = '<p>No hay registros disponibles para mostrar.</p>';
                    return;
                }

                const columnas = Object.keys(data[0]);

                let html = '<table><thead><tr>';
                for (let i = 0; i < columnas.length; i++) {
                    html += '<th>' + columnas[i] + '</th>';
                }
                html += '</tr></thead><tbody>';

                for (let i = 0; i < data.length; i++) {
                    html += '<tr>';
                    for (let j = 0; j < columnas.length; j++) {
                        const col = columnas[j];
                        const valor = (data[i][col] !== null && data[i][col] !== undefined) ? data[i][col] : '';
                        html += '<td>' + valor + '</td>';
                    }
                    html += '</tr>';
                }

                html += '</tbody></table>';
                contenedor.innerHTML = html;

            } catch (error) {
                contenedor.innerHTML = '<p style="color: #e74c3c; font-weight: bold;">Error al conectar con el servidor: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
